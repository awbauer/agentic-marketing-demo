<template>
  <template lwc:if={isUser}>
    <li class="slds-chat-listitem slds-chat-listitem_outbound">
      <div class="slds-chat-message">
        <div class="slds-chat-message__body">
          <div class="slds-chat-message__text slds-chat-message__text_outbound">
            <span>{message.text}</span>
          </div>
        </div>
      </div>
    </li>
  </template>
  <template lwc:else>
    <li class="slds-chat-listitem slds-chat-listitem_inbound answer">
      <div class="slds-chat-message answer">
        <div class="slds-chat-message__body answer">
          <template lwc:if={hasToolActivity}>
            <ol class="slds-m-bottom_x-small" aria-label="Tool calls" aria-live="polite">
              <template for:each={toolActivity} for:item="call">
                <li key={call.id} class="slds-grid slds-grid_vertical-align-center slds-m-bottom_xx-small">
                  <lightning-icon
                    icon-name={call.iconName}
                    variant={call.variant}
                    alternative-text={call.label}
                    size="xx-small"
                    class="slds-m-right_x-small"
                  ></lightning-icon>
                  <lightning-badge label={call.system} class="slds-m-right_x-small"></lightning-badge>
                  <span>{call.tool}</span>
                </li>
              </template>
            </ol>
          </template>

          <template lwc:if={hasTrace}>
            <div class={sectionClass}>
              <h3 class="slds-section__title">
                <button
                  type="button"
                  aria-expanded={ariaExpanded}
                  class="slds-button slds-section__title-action"
                  onclick={handleTraceToggle}
                >
                  <lightning-icon
                    icon-name="utility:switch"
                    alternative-text=""
                    size="x-small"
                    class="slds-section__title-action-icon slds-button__icon_left"
                  ></lightning-icon>
                  <span class="slds-truncate">Behind the scenes · technical trace · {traceSummary}</span>
                </button>
              </h3>
              <div class="slds-section__content">
                <ol>
                  <template for:each={rows} for:item="row">
                    <li key={row.key} class="slds-p-vertical_xx-small trace-row">
                      <div class="slds-grid slds-grid_vertical-align-center">
                        <lightning-icon
                          icon-name={row.iconName}
                          variant={row.variant}
                          alternative-text={row.state}
                          size="xx-small"
                          class="slds-m-right_x-small"
                        ></lightning-icon>
                        <strong class="slds-col_bump-right">{row.label}</strong>
                        <span class="slds-text-body_small">{row.elapsed}</span>
                      </div>
                      <p class="slds-text-body_small">{row.detail}</p>
                      <template lwc:if={row.payload}>
                        <button
                          type="button"
                          class="slds-button"
                          data-key={row.key}
                          aria-expanded={row.payloadExpanded}
                          onclick={handlePayloadToggle}
                        >
                          {row.payloadButton}
                        </button>
                        <template lwc:if={row.payloadOpen}>
                          <pre class="payload">{row.payload}</pre>
                        </template>
                      </template>
                    </li>
                  </template>
                </ol>
                <p class="slds-text-body_small slds-p-top_x-small">
                  Every model and tool lifecycle event for this turn, in order, with times from the
                  start of the turn. Credentials, confirmation material, and personal data are redacted.
                </p>
              </div>
            </div>
          </template>

          <template lwc:if={hasText}>
            <div class="slds-chat-message__text slds-chat-message__text_inbound answer">
              <lightning-formatted-rich-text value={html}></lightning-formatted-rich-text>
            </div>
          </template>
        </div>
      </div>
    </li>
  </template>
</template>
