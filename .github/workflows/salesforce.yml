name: Salesforce metadata

on:
  pull_request:
    paths:
      - ".github/workflows/salesforce.yml"
      - "salesforce/**"
      - "sfdx-project.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/salesforce.yml"
      - "salesforce/**"
      - "sfdx-project.json"
  workflow_dispatch:

concurrency:
  group: salesforce-proof-org
  cancel-in-progress: false

jobs:
  validate-or-deploy:
    runs-on: ubuntu-latest
    environment: proof
    permissions:
      contents: read
    env:
      SF_TARGET_ORG: northstar-ci
      SF_APPROVED_PROOF_ORG_ID: ${{ secrets.SF_APPROVED_PROOF_ORG_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Salesforce CLI
        run: npm install --global @salesforce/cli@2.128.5

      - name: Prepare local-only blocked-word gate
        env:
          BLOCKED_WORDS_LOCAL: ${{ secrets.BLOCKED_WORDS_LOCAL }}
        run: |
          test -n "$BLOCKED_WORDS_LOCAL"
          mkdir -p .config
          printf '%s\n' "$BLOCKED_WORDS_LOCAL" > .config/blocked-words.local
          chmod 600 .config/blocked-words.local

      - name: Run repository security and metadata contracts
        run: |
          pnpm security:blocked-words
          pnpm sf:metadata:check

      - name: Authenticate the dedicated proof org
        env:
          SF_SFDX_AUTH_URL: ${{ secrets.SF_SFDX_AUTH_URL }}
        run: |
          test -n "$SF_SFDX_AUTH_URL"
          printf '%s' "$SF_SFDX_AUTH_URL" | sf org login sfdx-url --alias "$SF_TARGET_ORG" --sfdx-url-stdin

      - name: Fail closed if authentication targets another org
        run: |
          test -n "$SF_APPROVED_PROOF_ORG_ID"
          ACTUAL_ORG_ID=$(sf data query --target-org "$SF_TARGET_ORG" --query "SELECT Id FROM Organization LIMIT 1" --json | jq -r '.result.records[0].Id')
          test "$ACTUAL_ORG_ID" = "$SF_APPROVED_PROOF_ORG_ID"

      - name: Fail if retired metadata exists in the org
        run: pnpm sf:retired:check

      - name: Validate Salesforce metadata
        if: github.event_name == 'pull_request'
        run: >-
          sf project deploy start --dry-run
          --source-dir salesforce/force-app/main/default/classes
          --source-dir salesforce/force-app/main/default/objects
          --source-dir salesforce/force-app/main/default/permissionsets
          --source-dir salesforce/force-app/main/default/mcpServerDefinitions
          --test-level RunSpecifiedTests
          --tests NorthstarCampaignActionsTest
          --tests NorthstarMarketingAgentTest
          --target-org "$SF_TARGET_ORG"
          --wait 30

      - name: Deploy Salesforce metadata
        if: github.event_name != 'pull_request'
        run: >-
          sf project deploy start
          --source-dir salesforce/force-app/main/default/classes
          --source-dir salesforce/force-app/main/default/objects
          --source-dir salesforce/force-app/main/default/permissionsets
          --source-dir salesforce/force-app/main/default/mcpServerDefinitions
          --test-level RunSpecifiedTests
          --tests NorthstarCampaignActionsTest
          --tests NorthstarMarketingAgentTest
          --target-org "$SF_TARGET_ORG"
          --wait 30

      # This org skips RunSpecifiedTests during deploys ("Running Tests - Skipped"), so the Apex
      # tests run explicitly after deployment and the step fails unless they all ran and passed.
      - name: Run Apex tests against the deployed code
        if: github.event_name != 'pull_request'
        run: |
          sf apex run test --class-names NorthstarCampaignActionsTest --class-names NorthstarMarketingAgentTest \
            --target-org "$SF_TARGET_ORG" --wait 20 --result-format json --json > apex-tests.json || true
          node -e '
            const r = JSON.parse(require("fs").readFileSync("apex-tests.json", "utf8")).result ?? {};
            const s = r.summary ?? {};
            console.log(`Apex tests: ${s.testsRan ?? 0} ran, ${s.passing ?? 0} passed, ${s.failing ?? 0} failed`);
            for (const t of r.tests ?? []) if (t.Outcome !== "Pass") console.log(`FAIL ${t.FullName}: ${t.Message}`);
            if (!(Number(s.testsRan) > 0) || Number(s.failing) > 0 || s.outcome !== "Passed") process.exit(1);
          '

      # Not a dot directory: once .forceignore exists the CLI ignores `**/.*`, so a retrieve into
      # one reports "Nothing retrieved" and still exits 0.
      - name: Read back governed MCP definition
        if: github.event_name != 'pull_request'
        run: |
          sf project retrieve start --metadata McpServerDefinition:NorthstarMarketingWorkbench --target-org "$SF_TARGET_ORG" --output-dir salesforce-readback --wait 10
          find salesforce-readback -name 'NorthstarMarketingWorkbench.mcpServerDefinition-meta.xml' -print -quit | grep -q .
